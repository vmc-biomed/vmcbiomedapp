<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VMC Biomedical – PM & Calibration</title>

<!-- ═══════════════════════════════════════════════════════════
     REAL web app manifest, served directly from GitHub Pages with
     no redirect — this is what Apps Script itself cannot do (every
     Apps Script response is forced through a Google execution
     redirect, which breaks Chrome's installability check). Because
     THIS page is what gets installed, Chrome now sees a valid
     manifest with "display":"standalone" and will actually launch
     the installed icon full-screen, no address bar — instead of
     falling back to opening a normal browser tab.
     ═══════════════════════════════════════════════════════════ -->
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0F2535">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1MZ5Ox1X0VJegn0tnkV5roNNgoHxWDfuh">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1MZ5Ox1X0VJegn0tnkV5roNNgoHxWDfuh">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VMC Biomed">

<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0F2535;}
  #appFrame{
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    height:100dvh; /* fallback for the very first paint, before JS sizing kicks in below */
    border:none;
    display:block;
  }
  /* Simple loading splash shown until the iframe's own content paints —
     avoids a blank white/dark flash on slow connections. */
  #splash{
    position:fixed; inset:0; z-index:10;
    background:#0F2535; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; font-family:system-ui,-apple-system,sans-serif;
    transition:opacity .3s ease;
  }
  #splash img{ width:64px; height:64px; border-radius:16px; }
  #splash .spin{
    width:28px; height:28px; border:3px solid rgba(255,255,255,.25);
    border-top-color:#0EA5E9; border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #splash.hide{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     REPLACE THE URL BELOW with your actual deployed Apps Script web
     app URL (Deploy > Manage deployments > Web app > URL). It looks
     like: https://script.google.com/macros/s/AKfycb.../exec
     ═══════════════════════════════════════════════════════════ -->
<iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbwsiZdBNh88Clj1-it5aiQQ3SibBHf3vyr04m-YE_XWuNEU785ELs67SkbYR7NK4HRP/exec" title="VMC Biomedical PM & Calibration" allow="camera *; microphone *; clipboard-write *; local-network-access *" allowfullscreen></iframe>

<div id="splash">
  <img src="https://lh3.googleusercontent.com/d/1MZ5Ox1X0VJegn0tnkV5roNNgoHxWDfuh" alt="VMC Biomedical">
  <div class="spin"></div>
</div>

<script>
  // Hide the splash once the iframe reports it has loaded. This can't
  // detect content INSIDE the iframe finishing (cross-origin — the
  // iframe is on script.google.com, this page is on GitHub Pages), only
  // that the frame navigation itself completed, so there's also a
  // generous timeout fallback in case the load event doesn't fire
  // cleanly across origins in some browsers.
  var frame=document.getElementById('appFrame');
  var splash=document.getElementById('splash');
  function hideSplash(){ splash.classList.add('hide'); }
  frame.addEventListener('load', function(){ setTimeout(hideSplash, 400); });
  setTimeout(hideSplash, 4000); // fallback safety net

  // ─── Fix for the app's bottom bar rendering "sunk" on cold-start ───
  // On a fresh launch of the installed PWA (not a normal browser tab),
  // Android hasn't finished settling its own chrome — status bar,
  // gesture nav bar — before the very first layout pass happens. The
  // CSS 100dvh unit on #appFrame can lock in a value measured DURING
  // that settling animation, i.e. momentarily taller than the true
  // final viewport. Since #appFrame's real height then doesn't match
  // the visible screen, the app running inside it (which sizes its own
  // fixed bottom bar off ITS OWN window dimensions) computes a
  // bottom-bar position based on a too-tall iframe viewport, rendering
  // the bar below what's actually visible — this is why it self-
  // corrected the instant anything forced a real resize (like opening
  // the scanner popup, which blurs/refocuses the window).
  //
  // Fix: set #appFrame's height explicitly from window.innerHeight
  // (the wrapper page's own real, already-settled viewport height —
  // this outer page is a normal top-level page, not inside anything
  // else, so its own innerHeight is reliable from the start) instead
  // of trusting the iframe's internal dvh calculation. Re-applied
  // after a short delay to catch any late chrome-settling, and on
  // every resize/orientation change afterward. Setting the iframe's
  // OWN height also causes the iframe's content window to receive a
  // real 'resize' event, which is what the app's own
  // _updateMobileBottomBarVisibility() listens for — so this fixes
  // the root cause rather than requiring the scanner-popup workaround.
  function _sizeAppFrame(){
    frame.style.height = window.innerHeight + 'px';
  }
  _sizeAppFrame();
  setTimeout(_sizeAppFrame, 300);  // catch late Android chrome-settling
  setTimeout(_sizeAppFrame, 1000); // extra safety net for slower devices
  window.addEventListener('resize', _sizeAppFrame);
  window.addEventListener('orientationchange', function(){
    setTimeout(_sizeAppFrame, 300); // orientation change needs a beat to settle too
  });
</script>

<!-- ═══════════════════════════════════════════════════════════
     PUSH NOTIFICATIONS (Firebase Cloud Messaging) — confirmed request.
     This wrapper page is the only piece of this app that runs as a
     genuine top-level page on a stable origin, which is a hard
     requirement for both Service Worker registration and the
     Notification permission prompt — neither works from inside the
     cross-origin Apps Script <iframe> above. Coordinates with the app
     inside that iframe via postMessage: the app tells this page once
     someone's actually logged in (so permission is only ever requested
     at a meaningful moment, never on a cold, pre-login page load), and
     this page hands back the resulting device token for the app to
     save server-side.
     ═══════════════════════════════════════════════════════════ -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js';

  var firebaseConfig = {
    apiKey: "AIzaSyCLHHgmqM_8c3q_a6__Zq-l7lfpvjLiaB4",
    authDomain: "vmc-biomed-chat.firebaseapp.com",
    databaseURL: "https://vmc-biomed-chat-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "vmc-biomed-chat",
    storageBucket: "vmc-biomed-chat.firebasestorage.app",
    messagingSenderId: "662980281608",
    appId: "1:662980281608:web:83cb3f2968f97cd40ed8bd"
  };
  // Public "Web Push certificate" key (Firebase console > Project
  // Settings > Cloud Messaging > Web configuration) — safe to embed
  // client-side, same trust model as the apiKey above; it identifies
  // this app to the push service, it isn't a secret credential.
  var VAPID_KEY = 'BMEjsKTjIRouXCvTEkVW4xDymOORB6d_mrxV3kHsyTNmQCKmTvRUwcbyQHr5IMuGTpxy8k_U_HJykR2zFfdZL_U';

  var _notifSetupStarted = false;
  function _setupPushNotifications(){
    if(_notifSetupStarted) return;
    _notifSetupStarted = true;
    if(!('serviceWorker' in navigator) || !('Notification' in window)) return; // unsupported browser — silently do nothing, chat/app itself is unaffected either way
    if(Notification.permission === 'denied') return; // user already said no — don't re-prompt every login, that's exactly the nagging behavior browsers penalize
    navigator.serviceWorker.register('firebase-messaging-sw.js').then(function(registration){
      return Notification.requestPermission().then(function(permission){
        if(permission !== 'granted') return;
        var app = initializeApp(firebaseConfig);
        var messaging = getMessaging(app);
        return getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: registration }).then(function(token){
          if(token && frame && frame.contentWindow){
            frame.contentWindow.postMessage({ type:'vmc-fcm-token', token: token }, '*');
          }
        });
      });
    }).catch(function(err){
      console.warn('Push notification setup failed (non-fatal):', err);
    });
  }
  window.addEventListener('message', function(event){
    if(event.data && event.data.type === 'vmc-app-logged-in'){
      _setupPushNotifications();
    }
  });
</script>

</body>
</html>
